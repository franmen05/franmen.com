  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"18e0e086-e3d0-4627-8baa-59879df10265\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"86964202-31c3-4b61-a93d-318a2923bfff\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Franmen Guillermo De Los Santos — Sitio Profesional\n   Sistema visual: tinta profunda + acento aqua técnico\n   ============================================================ */\n\n:root {\n  /* Dark (default) */\n  --bg:        #0a0e15;\n  --bg-2:      #0c111a;\n  --surface:   #111826;\n  --surface-2: #151d2e;\n  --border:        rgba(255,255,255,0.08);\n  --border-strong: rgba(255,255,255,0.15);\n  --text:   #e9edf4;\n  --text-2: #a7b1c2;\n  --text-3: #6a7588;\n  --accent:     #46e3c0;\n  --accent-dim: #2bbf9f;\n  --accent-ink: #052b24;\n  --glow-1: rgba(70,227,192,0.16);\n  --glow-2: rgba(96,120,255,0.12);\n  --shadow: 0 24px 60px -20px rgba(0,0,0,0.6);\n\n  --maxw: 1120px;\n  --font-display: \"Space Grotesk\", system-ui, sans-serif;\n  --font-body: \"Hanken Grotesk\", system-ui, sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, monospace;\n}\n\n[data-theme=\"light\"] {\n  --bg:        #f6f5f1;\n  --bg-2:      #efeee9;\n  --surface:   #ffffff;\n  --surface-2: #f4f3ee;\n  --border:        rgba(12,16,24,0.10);\n  --border-strong: rgba(12,16,24,0.18);\n  --text:   #0d1320;\n  --text-2: #4c5666;\n  --text-3: #8b94a3;\n  --accent:     #0c9e84;\n  --accent-dim: #0a8470;\n  --accent-ink: #ffffff;\n  --glow-1: rgba(12,158,132,0.12);\n  --glow-2: rgba(96,120,255,0.10);\n  --shadow: 0 24px 50px -24px rgba(20,30,50,0.22);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { scroll-behavior: smooth; scroll-padding-top: 96px; }\n\nbody {\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-body);\n  font-size: 17px;\n  line-height: 1.65;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n  transition: background .5s ease, color .5s ease;\n}\n\n::selection { background: var(--accent); color: var(--accent-ink); }\n\na { color: inherit; text-decoration: none; }\n\n.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }\n\n.mono { font-family: var(--font-mono); }\n\n/* ---------------- Nav ---------------- */\n.nav {\n  position: fixed; inset: 0 0 auto 0; z-index: 100;\n  transition: background .35s ease, border-color .35s ease, backdrop-filter .35s;\n  border-bottom: 1px solid transparent;\n}\n.nav.scrolled {\n  background: color-mix(in srgb, var(--bg) 78%, transparent);\n  backdrop-filter: blur(18px) saturate(140%);\n  -webkit-backdrop-filter: blur(18px) saturate(140%);\n  border-bottom: 1px solid var(--border);\n}\n.nav-inner {\n  height: 76px; display: flex; align-items: center; justify-content: space-between;\n}\n.nav-logo {\n  font-family: var(--font-mono); font-weight: 500; font-size: 15px;\n  letter-spacing: .02em; display: flex; align-items: center; gap: 9px; white-space: nowrap;\n}\n.nav-logo .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }\n.nav-logo b { font-weight: 700; }\n.nav-logo .muted { color: var(--text-3); }\n\n.nav-links { display: flex; align-items: center; gap: 32px; }\n.nav-links a {\n  font-size: 14px; color: var(--text-2); font-weight: 500; white-space: nowrap;\n  position: relative; transition: color .2s; letter-spacing: .01em;\n}\n.nav-links a::after {\n  content: \"\"; position: absolute; left: 0; bottom: -6px; height: 2px; width: 0;\n  background: var(--accent); transition: width .25s ease;\n}\n.nav-links a:hover { color: var(--text); }\n.nav-links a.active { color: var(--text); }\n.nav-links a.active::after { width: 100%; }\n\n.nav-right { display: flex; align-items: center; gap: 14px; }\n.theme-toggle {\n  width: 40px; height: 40px; display: grid; place-items: center;\n  border: 1px solid var(--border); border-radius: 11px; background: transparent;\n  color: var(--text-2); cursor: pointer; transition: all .2s;\n}\n.theme-toggle:hover { color: var(--text); border-color: var(--border-strong); transform: translateY(-1px); }\n.theme-toggle svg { width: 18px; height: 18px; }\n.theme-toggle .sun { display: none; }\n[data-theme=\"light\"] .theme-toggle .sun { display: block; }\n[data-theme=\"light\"] .theme-toggle .moon { display: none; }\n\n.btn {\n  display: inline-flex; align-items: center; gap: 9px;\n  font-family: var(--font-body); font-weight: 600; font-size: 14.5px;\n  padding: 12px 20px; border-radius: 12px; cursor: pointer;\n  border: 1px solid transparent; transition: all .22s ease; white-space: nowrap;\n}\n.btn-primary { background: var(--accent); color: var(--accent-ink); }\n.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -10px var(--accent); }\n.btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }\n.btn-ghost:hover { background: var(--surface); border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }\n\n.nav-toggle { display: none; }\n\n/* ---------------- Hero ---------------- */\n.hero { position: relative; padding: 188px 0 120px; overflow: hidden; }\n.hero-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }\n.hero-bg .glow {\n  position: absolute; border-radius: 50%; filter: blur(90px); opacity: .9;\n}\n.hero-bg .g1 { width: 620px; height: 620px; top: -200px; right: -120px; background: var(--glow-1); }\n.hero-bg .g2 { width: 520px; height: 520px; top: 120px; left: -180px; background: var(--glow-2); }\n.hero-bg .grid {\n  position: absolute; inset: 0;\n  background-image: linear-gradient(var(--border) 1px, transparent 1px),\n                    linear-gradient(90deg, var(--border) 1px, transparent 1px);\n  background-size: 64px 64px;\n  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 0%, transparent 80%);\n          mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 0%, transparent 80%);\n  opacity: .5;\n}\n.hero .wrap { position: relative; z-index: 1; }\n\n.hero-eyebrow {\n  display: inline-flex; align-items: center; gap: 11px;\n  font-family: var(--font-mono); font-size: 13px; letter-spacing: .04em; line-height: 1.5;\n  color: var(--text-2); padding: 8px 15px; border: 1px solid var(--border);\n  border-radius: 100px; background: color-mix(in srgb, var(--surface) 60%, transparent);\n}\n.hero-eyebrow .dot-static, .hero-eyebrow .pulse { flex-shrink: 0; }\n.hero-eyebrow .pulse {\n  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);\n  box-shadow: 0 0 0 0 var(--accent); animation: pulse 2.4s infinite;\n}\n.hero-eyebrow .dot-static {\n  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);\n}\n@keyframes pulse {\n  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); }\n  70% { box-shadow: 0 0 0 10px transparent; }\n  100% { box-shadow: 0 0 0 0 transparent; }\n}\n\n.hero-title {\n  font-family: var(--font-display); font-weight: 700;\n  font-size: clamp(44px, 7.4vw, 92px); line-height: .98; letter-spacing: -0.03em;\n  margin: 30px 0 0; text-wrap: balance;\n}\n.hero-title .accent { color: var(--accent); }\n.hero-role {\n  font-family: var(--font-mono); font-size: clamp(15px, 2vw, 19px);\n  color: var(--text-2); margin-top: 26px; letter-spacing: .01em;\n}\n.hero-role .sep { color: var(--accent); margin: 0 10px; }\n.hero-sub {\n  max-width: 620px; margin-top: 24px; font-size: clamp(16px,2.1vw,19px);\n  color: var(--text-2); line-height: 1.7;\n}\n.hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 38px; }\n\n.hero-stats {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;\n  margin-top: 72px; border: 1px solid var(--border); border-radius: 18px; overflow: hidden;\n  background: var(--border);\n}\n.stat { background: var(--bg); padding: 26px 24px; }\n.stat .num { font-family: var(--font-display); font-weight: 600; font-size: clamp(26px,3.4vw,38px); letter-spacing: -.02em; }\n.stat .num .accent { color: var(--accent); }\n.stat .lbl { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); margin-top: 6px; letter-spacing: .02em; text-transform: uppercase; }\n\n/* ---------------- Section scaffold ---------------- */\n.section { padding: 104px 0; position: relative; }\n.section.alt { background: var(--bg-2); }\n.section-head { margin-bottom: 56px; max-width: 760px; }\n.section-num {\n  font-family: var(--font-mono); font-size: 13px; color: var(--accent);\n  letter-spacing: .08em; display: block; margin-bottom: 16px;\n}\n.section-title {\n  font-family: var(--font-display); font-weight: 600;\n  font-size: clamp(30px, 4.4vw, 50px); letter-spacing: -.025em; line-height: 1.05;\n}\n.section-intro { color: var(--text-2); font-size: 18px; margin-top: 18px; line-height: 1.7; }\n\n/* ---------------- About ---------------- */\n.about-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 60px; align-items: start; }\n.about-body p { color: var(--text-2); font-size: 18.5px; line-height: 1.78; margin-bottom: 22px; }\n.about-body p strong { color: var(--text); font-weight: 600; }\n.about-body .lead { font-size: 21px; color: var(--text); font-weight: 500; }\n\n.about-card {\n  border: 1px solid var(--border); border-radius: 18px; padding: 28px;\n  background: var(--surface); position: sticky; top: 110px;\n}\n.about-card h4 { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 18px; }\n.about-photo { display: flex; justify-content: center; margin-bottom: 24px; }\n.about-photo img { width: 148px; height: 148px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-strong); display: block; }\n.about-card .row { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-top: 1px solid var(--border); font-size: 15px; }\n.about-card .row:first-of-type { border-top: none; }\n.about-card .row .k { color: var(--text-3); }\n.about-card .row .v { color: var(--text); font-weight: 500; text-align: right; }\n.about-card .v .accent { color: var(--accent); }\n\n/* ---------------- Timeline ---------------- */\n.timeline { position: relative; }\n.timeline::before {\n  content: \"\"; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px;\n  background: linear-gradient(var(--accent), var(--border) 60%);\n}\n.tl-item { position: relative; padding: 0 0 44px 46px; }\n.tl-item:last-child { padding-bottom: 0; }\n.tl-marker {\n  position: absolute; left: 0; top: 6px; width: 20px; height: 20px; border-radius: 50%;\n  background: var(--bg); border: 2px solid var(--accent); display: grid; place-items: center;\n}\n.tl-marker::after { content: \"\"; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }\n.tl-item.muted .tl-marker { border-color: var(--border-strong); }\n.tl-item.muted .tl-marker::after { background: var(--text-3); }\n\n.tl-card {\n  border: 1px solid var(--border); border-radius: 16px; padding: 26px 28px;\n  background: var(--surface); transition: border-color .25s, transform .25s, box-shadow .25s;\n}\n.tl-card:hover { border-color: var(--border-strong); transform: translateY(-3px); box-shadow: var(--shadow); }\n.tl-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 20px; }\n.tl-role { font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: -.01em; }\n.tl-company { color: var(--accent); font-weight: 600; font-size: 16px; }\n.tl-period { font-family: var(--font-mono); font-size: 13px; color: var(--text-3); white-space: nowrap; }\n.tl-desc { color: var(--text-2); margin-top: 14px; line-height: 1.7; font-size: 16px; }\n.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }\n.tag {\n  font-family: var(--font-mono); font-size: 12.5px; color: var(--text-2);\n  padding: 5px 11px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2);\n}\n\n/* ---------------- Skills ---------------- */\n.skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }\n.skill-cat { border: 1px solid var(--border); border-radius: 16px; padding: 26px; background: var(--surface); }\n.skill-cat-title { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 17px; margin-bottom: 18px; }\n.skill-cat-title .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }\n.skill-cat-title .ic svg { width: 18px; height: 18px; }\n.chips { display: flex; flex-wrap: wrap; gap: 9px; }\n.chip {\n  font-family: var(--font-mono); font-size: 13px; color: var(--text);\n  padding: 7px 13px; border: 1px solid var(--border); border-radius: 9px;\n  background: var(--surface-2); transition: all .2s;\n}\n.chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }\n\n/* ---------------- Projects ---------------- */\n.projects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }\n.proj-card {\n  border: 1px solid var(--border); border-radius: 18px; padding: 30px; background: var(--surface);\n  display: flex; flex-direction: column; transition: all .25s; position: relative; overflow: hidden;\n}\n.proj-card::before {\n  content: \"\"; position: absolute; inset: 0 0 auto 0; height: 3px;\n  background: linear-gradient(90deg, var(--accent), transparent); opacity: 0; transition: opacity .3s;\n}\n.proj-card:hover { transform: translateY(-4px); border-color: var(--border-strong); box-shadow: var(--shadow); }\n.proj-card:hover::before { opacity: 1; }\n.proj-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }\n.proj-icon { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--accent); }\n.proj-icon svg { width: 22px; height: 22px; }\n.proj-period { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-3); }\n.proj-name { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin-top: 20px; letter-spacing: -.01em; }\n.proj-award {\n  display: inline-flex; align-items: center; gap: 8px; margin-top: 10px;\n  font-family: var(--font-mono); font-size: 12.5px; color: var(--accent);\n  padding: 6px 12px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);\n  border-radius: 100px; background: color-mix(in srgb, var(--accent) 10%, transparent);\n}\n.proj-award svg { flex-shrink: 0; }\n.proj-desc { color: var(--text-2); margin-top: 10px; line-height: 1.65; font-size: 15.5px; flex: 1; }\n.proj-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; font-family: var(--font-mono); font-size: 13.5px; color: var(--accent); font-weight: 500; }\n.proj-link svg { width: 15px; height: 15px; transition: transform .2s; }\n.proj-link:hover svg { transform: translate(2px,-2px); }\n\n/* ---------------- Education + Awards two-col ---------------- */\n.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }\n.block-title { font-family: var(--font-mono); font-size: 13px; color: var(--accent); letter-spacing: .06em; text-transfor -text-2: #39414f; --text-3: #6b7484;\n    --accent: #0a7d68; --accent-dim: #0a8470; --accent-ink: #ffffff;\n    --glow-1: transparent; --glow-2: transparent; --shadow: none;\n  }\n  .nav, .hero-bg, .contact-glow, .footer .top, .hero-actions, .nav-toggle { display: none !important; }\n  .hero { padding: 24px 0; }\n  .section, .contact { padding: 28px 0; }\n  html.js .reveal { opacity: 1 !important; transform: none !important; }\n  .tl-card, .skill-cat, .proj-card, .about-card { break-inside: avoid; }\n  body { font-size: 12pt; }\n}\n<\u002Fstyle>\n\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"Person\",\n  \"name\": \"Franmen Guillermo De Los Santos\",\n  \"jobTitle\": \"Senior Software Engineer\",\n  \"worksFor\": { \"@type\": \"Organization\", \"name\": \"Claro Dominicana\" },\n  \"address\": { \"@type\": \"PostalAddress\", \"addressLocality\": \"Santo Domingo\", \"addressCountry\": \"DO\" },\n  \"email\": \"mailto:franmen05@gmail.com\",\n  \"alumniOf\": [\n    { \"@type\": \"CollegeOrUniversity\", \"name\": \"Universidad APEC\" },\n    { \"@type\": \"CollegeOrUniversity\", \"name\": \"Instituto Tecnológico de las Américas (ITLA)\" }\n  ],\n  \"knowsAbout\": [\"Java\", \"Kotlin\", \"Quarkus\", \"Spring Boot\", \"Arquitectura orientada a eventos\", \"Microservicios\", \"Camunda BPM\", \"Drools\", \"Oracle\", \"MongoDB\"],\n  \"sameAs\": [\n    \"https://www.linkedin.com/in/franmen-guillermo-de-los-santos-4773b120\",\n    \"https://github.com/franmen05\"\n  ]\n}\n<\u002Fscript>\n<\u002Fhead>\n<body>\n\n<!-- ================= NAV ================= -->\n<header class=\"nav\">\n  <div class=\"wrap nav-inner\">\n    <a href=\"#top\" class=\"nav-logo\">\n      <span class=\"dot\"><\u002Fspan>\n      <span><b>Franmen<\u002Fb> <span class=\"muted\">De Los Santos<\u002Fspan><\u002Fspan>\n    <\u002Fa>\n    <nav class=\"nav-links\">\n      <a href=\"#sobre-mi\">Sobre mí<\u002Fa>\n      <a href=\"#experiencia\">Experiencia<\  class=\"sep\">/<\u002Fspan> Arquitectura orientada a eventos <span class=\"sep\">/<\u002Fspan> JVM<\u002Fp>\n    <p class=\"hero-sub reveal d2\">Más de 15 años en el análisis, diseño y desarrollo de software empresarial — desde plataformas de <em>workforce management<\u002Fem> reactivas hasta motores de reglas de negocio y automatización de procesos sobre la JVM.<\u002Fp>\n    <div class=\"hero-actions reveal d3\">\n      <a href=\"#experiencia\" class=\"btn btn-primary\">Ver experiencia<\u002Fa>\n      <a href=\"cv.html\" target=\"_blank\" class=\"btn btn-ghost\">\n        <svg viewBox=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"><\u002Fpath><\u002Fsvg>\n        Descargar CV\n      <\u002Fa>\n      <a href=\"#contacto\" class=\"btn btn-ghost\">Contacto<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"hero-stats reveal d3\">\n      <div class=\"stat\"><div class=\"num\">+<span class=\"accent\">15<\u002Fspan><\u002Fdiv><div class=\"lbl\">Años de experiencia<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"num\">8<\u002Fdiv><div class=\"lbl\">Empresas<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"num\">Java<span class=\"accent\">·<\u002Fspan>Kotlin<\u002Fdiv><div class=\"lbl\">Stack principal<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"num\">3<\u002Fdiv><div class=\"lbl\">Reconocimientos<\u002Fdiv><\u002Fdiv>    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= SOBRE MÍ ================= -->\n<section id=\"sobre-mi\" class=\"section\" data-screen-label=\"Sobre mí\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"section-num\">01 — Sobre mí<\u002Fspan>\n      <h2 class=\"section-title\">Pragmático, proactivo<br>y apasionado por el código.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"about-grid\">\n      <div class=\"about-body reveal d1\">\n        <p class=\"lead\">Cuento con más de 15 años de experiencia en el análisis, diseño y desarrollo de software de diversas índoles.<\u002Fp>\n        <p>Me considero una persona <strong>pragmática, proactiva y apasionada<\u002Fstrong> que no se amilana ante los desafíos. Soy muy comprometido con mi trabajo y con la excelencia en cada tarea que realizo.<\u002Fp>\n        <p>Mi especialidad es el <strong>backend empresarial sobre la JVM<\u002Fstrong>: arquitecturas reactivas basadas en eventos (<em>Domain Event Design<\u002Fem>), microservicios con Quarkus, motores de reglas de negocio (Drools, Kogito) y automatización de procesos con BPM (Camunda, jBPM). He llevado sistemas desde la etapa de factibilidad y análisis hasta su puesta en producción, alcanzando niveles de estabilidad y escalabilidad muy considerables.<\u002Fp>\n      <\u002Fdiv>\n      <aside class=\"about-card reveal d2\">\n        <div class=\"about-photo\">\n          <img src=\"9461db77-e78c-43b0-874d-4822c9cc16cc\" alt=\"Franmen Guillermo De Los Santos\">\n        <\u002Fdiv>\n        <h4>Perfil rápido<\u002Fh4>\n        <div class=\"row\"><span class=\"k\">Rol<\u002Fspan><span class=\"v\">Senior Software Engineer<\u002Fspan><\u002Fdiv>\n        <div class=\"row\"><span class=\"k\">Ubicación<\u002Fspan><span class=\"v\">Santo Domingo, RD<\u002Fspan><\u002Fdiv>\n        <div class=\"row\"><span class=\"k\">Experiencia<\u002Fspan><span class=\"v\"><span class=\"accent\">+15 años<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div class=\"row\"><span class=\"k\">Foco<\u002Fspan><span class=\"v\">Event-driven · Microservicios<\u002Fspan><\u002Fdiv>\n        <div class=\"row\"><span class=\"k\">Idiomas<\u002Fspan><span class=\"v\">Español · Inglés<\u002Fspan><\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= EXPERIENCIA ================= -->\n<section id=\"experiencia\" class=\"section alt\" data-screen-label=\"Experiencia\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"section-num\">02 — Trayectoria<\u002Fspan>\n      <h2 class=\"section-title\">Experiencia profesional<\u002Fh2>\n      <p class=\"section-intro\">Una década y media construyendo software para las principales operadoras de telecomunicaciones y consultoras de República Dominicana.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"timeline\">\n      <div class=\"tl-item reveal\">\n        <div class=\"tl-marker\"><\u002Fdiv>\n        <div class=\"tl-card\">\n          <div class=\"tl-top\">\n            <div><span class=\"tl-role\">Senior Software Developer<\u002Fspan> <span class=\"tl-company\">· Claro Dominicana<\u002Fspan><\u002Fdiv>\n            <span class=\"tl-period\">Ago 2020 — Presente<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"tl-desc\">Análisis y diseño del sistema de <strong>workforce management<\u002Fstrong>, diseñado bajo <em>Domain Event Design<\u002Fem> (arquitectura reactiva basada en eventos), Quarkus y microservicios — logrando niveles de estabilidad y escalabilidad muy considerables.<\u002Fp>\n          <div class=\"tags\">\n            <span class=\"tag\">Java<\u002Fspan><span class=\"tag\">Quarkus<\u002Fspan><span class=\"tag\">Spring<\u002Fspan><span class=\"tag\">Kafka<\u002Fspan><span class=\"tag\">Camunda BPM<\u002Fspan><span class=\"tag\">Kogito<\u002Fspan><span class=\"tag\">Oracle<\u002Fspan><span class=\"tag\">MongoDB<\u002Fspan><span class=\"tag\">Angular<\u002Fspan><span class=\"tag\">Docker<\u002Fspan><span class=\"tag\">OpenShift<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tl-item reveal\">\n        <div class=\"tl-marker\"><\u002Fdiv>\n        <div class=\"tl-card\">\n          <div class=\"tl-top\">\n            <div><span class=\"tl-role\">Senior Software Developer<\u002Fspan> <span class=\"tl-company\">· Soluciones GBH<\u002Fspan><\u002Fdiv>\n            <span class=\"tl-period\">Ago 2019 — Ago 2020<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"tl-desc\">Análisis, diseño y desarrollo de proyectos según requerimientos. Destaca la <strong>automatización de la aplicación de reglas de negocio<\u002Fstrong> mediante el motor de reglas Drools.<\u002Fp>\n          <div class=\"tags\">\n            <span class=\"tag\">Java<\u002Fspan><span class=\"tag\">Drools<\u002Fspan><span class=\"tag\">Spring Boot<\u002Fspan><span class=\"tag\">React<\u002Fspan><span class=\"tag\">TypeScript<\u002Fspan><span class=\"tag\">NodeJS<\u002Fspan><span class=\"tag\">PostgreSQL<\u002Fspan><span class=\"tag\">Docker<\u002Fspan><span class=\"tag\">Git<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tl-item reveal\">\n        <div class=\"tl-marker\"><\u002Fdiv>\n        <div class=\"tl-card\">\n          <div class=\"tl-top\">\n            <div><span class=\"tl-role\">Senior Software Developer<\u002Fspan> <span class=\"tl-company\">· Altice Dominicana<\u002Fspan><\u002Fdiv>\n            <span class=\"tl-period\">Jul 2016 — Ago 2019<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"tl-desc\">Lideré diversas iniciativas de éxito: un nuevo módulo para la <strong>automatización de procesos de comisiones<\u002Fstrong> con jBPM, módulos para el extranet e intranet empresarial, y servicios web, microservicios e interfaces para la comunicación entre finanzas y red móvil.<\u002Fp>\n          <div class=\"tags\">\n            <span class=\"tag\">Oracle<\u002Fspan><span class=\"tag\">PL/SQL<\u002Fspan><span class=\"tag\">Spring Boot<\u002Fspan><span class=\"tag\">Hibernate<\u002Fspan><span class=\"tag\">jBPM<\u002Fspan><span class=\"tag\">Liferay<\u002Fspan><span class=\"tag\">REST<\u002Fspan><span class=\"tag\">C#<\u002Fspan><span class=\"tag\">OpenShift<\u002Fspan><span class=\"tag\">Docker<\u002Fspan><span class=\"tag\">Linux<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <
